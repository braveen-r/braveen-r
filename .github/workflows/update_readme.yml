name: Update GitHub Profile README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Add this permissions block here:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil lxml python-dotenv

      - name: Run SVG Generator Script
        env:
          README_STATS_TOKEN: ${{ secrets.README_STATS_TOKEN }}
          USER_NAME: "Braveen811"
        run: python generate_svg.py

      - name: Commit and Push Updated SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add terminal.svg
          git diff --quiet && git diff --cached --quiet || (git commit -m "chore: auto-update terminal profile SVG [skip ci]" && git push)