name: Update Terminal SVG

on:
  schedule:
    # Runs at 18:30 UTC every day, which is exactly 00:00 (Midnight) IST
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows you to click a button in GitHub to run it manually

jobs:
  update-svg:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the action permission to push the updated SVG back to your repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # You can specify any recent 3.x version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv

      - name: Run Python Script to Generate SVG
        env:
          # Pulls your token from GitHub Secrets and injects it as an environment variable
          README_STATS_TOKEN: ${{ secrets.README_STATS_TOKEN }}
        # Replace 'script.py' with the actual name of your Python file
        run: python generate_svg.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal.svg
          
          # This checks if there are actually any changes before trying to commit.
          # It prevents the workflow from failing on days where the stats/uptime don't change.
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update terminal.svg uptime and stats" && git push)